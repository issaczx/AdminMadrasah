<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Laporan Resmi — SIM Administrasi Madrasah</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
  <aside class="app-sidebar" id="sidebar-container"></aside>

  <div class="app-main">
    <header class="app-topbar" id="topbar-container"></header>

    <main class="page-content">
      
      <!-- Top Control Bar (Non-Printable) -->
      <div class="card-madrasah p-3 mb-4 no-print">
        <div class="row g-3 align-items-center justify-content-between">
          
          <div class="col-lg-8 d-flex flex-wrap gap-2 align-items-center">
            <div style="min-width: 200px;">
              <select class="form-select form-select-sm fw-bold border-primary" id="laporanTipeSelect">
                <option value="kehadiran">Rekapitulasi Kehadiran Siswa</option>
                <option value="jurnal">Rekap Jurnal Pembelajaran Guru</option>
                <option value="nilai">Rekap Nilai Sumatif & Capaian</option>
              </select>
            </div>

            <div style="min-width: 150px;">
              <select class="form-select form-select-sm" id="laporanSelectKelas">
                <!-- Injected options -->
              </select>
            </div>

            <!-- Jurnal Date Range Filter Container (Muncul otomatis saat tipe = jurnal) -->
            <div id="jurnalDateRangeContainer" class="d-none align-items-center gap-1 bg-light p-1 px-2 border rounded">
              <span class="small text-muted fw-bold"><i class="bi bi-calendar-range me-1"></i>Periode:</span>
              <input type="date" class="form-control form-control-sm" id="laporanTglMulai" title="Tanggal Mulai" style="width: 130px;">
              <span class="small text-muted fw-bold">s/d</span>
              <input type="date" class="form-control form-control-sm" id="laporanTglSelesai" title="Tanggal Selesai" style="width: 130px;">
              <button type="button" class="btn btn-xs btn-outline-secondary" id="btnResetJurnalDateRange" title="Reset Rentang Tanggal">
                <i class="bi bi-arrow-counterclockwise"></i>
              </button>
            </div>
          </div>

          <div class="col-lg-4 text-lg-end d-flex flex-wrap gap-2 justify-content-lg-end">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#customTemplateCollapse">
              <i class="bi bi-sliders me-1"></i> Atur Kop & Tanda Tangan
            </button>

            <button type="button" class="btn btn-sm btn-madrasah px-3" id="btnPrintLaporan">
              <i class="bi bi-printer-fill me-1"></i> Cetak / Simpan PDF
            </button>
          </div>
        </div>

        <!-- Collapsible Settings for TTD and Kop -->
        <div class="collapse mt-3 pt-3 border-top" id="customTemplateCollapse">
          <div class="row g-3">
            <div class="col-md-12">
              <label for="laporanJudulCustom" class="form-label small">Judul Dokumen Laporan (Editable)</label>
              <input type="text" class="form-control form-control-sm fw-bold" id="laporanJudulCustom" value="LAPORAN REKAPITULASI KEHADIRAN SISWA">
            </div>

            <div class="col-md-3">
              <label for="ttdKota" class="form-label small">Kota Penerbitan</label>
              <input type="text" class="form-control form-control-sm" id="ttdKota" value="Jakarta">
            </div>

            <div class="col-md-3">
              <label for="ttdTanggal" class="form-label small">Tanggal Pengesahan</label>
              <input type="date" class="form-control form-control-sm" id="ttdTanggal">
            </div>

            <div class="col-md-3">
              <label for="ttdKamadNama" class="form-label small">Nama Kepala Madrasah</label>
              <input type="text" class="form-control form-control-sm" id="ttdKamadNama">
            </div>

            <div class="col-md-3">
              <label for="ttdKamadNip" class="form-label small">NIP Kepala Madrasah</label>
              <input type="text" class="form-control form-control-sm" id="ttdKamadNip">
            </div>

            <div class="col-md-6">
              <label for="ttdGuruNama" class="form-label small">Nama Guru Pengampu</label>
              <input type="text" class="form-control form-control-sm" id="ttdGuruNama">
            </div>

            <div class="col-md-6">
              <label for="ttdGuruNip" class="form-label small">NIP Guru Pengampu</label>
              <input type="text" class="form-control form-control-sm" id="ttdGuruNip">
            </div>
          </div>
        </div>
      </div>

      <!-- Printable Document Output Area -->
      <div id="printDocumentArea">
        <!-- Injected dynamically by laporan.js -->
      </div>

    </main>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Core Scripts -->
<script src="js/github-api.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/laporan.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  await window.App.init('laporan');
  window.Laporan.init();
});
</script>

</body>
</html>
